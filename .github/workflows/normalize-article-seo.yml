name: Normalize article SEO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/normalize-article-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Normalize article SEO metadata
        run: python scripts/normalize_article_seo.py

      - name: Commit normalized articles
        shell: bash
        run: |
          if git diff --quiet -- articles; then
            echo "No article changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          git commit -m "Normalize article SEO metadata"
          git push
