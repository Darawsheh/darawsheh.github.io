name: Resolve giscus configuration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  discussions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve repository and discussion category IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { repository(owner: "Darawsheh", name: "darawsheh.github.io") { id discussionCategories(first: 20) { nodes { id name isAnswerable } } } }'
