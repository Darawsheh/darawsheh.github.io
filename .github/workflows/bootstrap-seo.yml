name: Bootstrap SEO upgrades

on:
  push:
    branches:
      - agent/seo-indexing-upgrades

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-indexing-upgrades

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply SEO upgrades
        run: python scripts/bootstrap_seo.py

      - name: Validate generated changes
        run: python scripts/seo_validate.py

      - name: Commit generated SEO changes
        shell: bash
        run: |
          git diff --check
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply SEO indexing upgrades"
          git push origin HEAD:agent/seo-indexing-upgrades
